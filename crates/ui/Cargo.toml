[package]
name = "shroom-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
shroom-js = { path = "../js" }
serde = { workspace = true }
serde_json = { workspace = true }
shroom-core = { workspace = true }
shroom-client = { workspace = true }
shroom-backend = { workspace = true }
shroom-ext = { workspace = true }
shroom-session = { workspace = true }
shroom-ai = { path = "../ai" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"
pulldown-cmark = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
