[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
shroom-core = { path = "crates/core" }
shroom-client = { path = "crates/client" }
shroom-backend = { path = "crates/backend" }
shroom-ext = { path = "crates/ext" }
shroom-session = { path = "crates/session" }
shroom-ui = { path = "crates/ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
pulldown-cmark = "0.13"
extism = "1"
# No default TLS: genai's default pulls aws-lc-sys, whose build script tracks
# PKG_CONFIG_PATH, so every switch between `cargo` and `scripts/dev.sh cargo`
# rebuilt the whole HTTP stack. shroom-ai picks rustls+ring instead.
genai = { version = "0.7.0-rc.8", default-features = false, features = ["system-proxy"] }
ratatui = "0.29"
crossterm = "0.28"
gpui = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "b564a34413bb7ef1da04121c4a287758f94993d9", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "59f89243cea79dd70eb7a619b3930c374ef6958a" }

[profile.dev.package."*"]
# gpui and wasmtime are unusable unoptimized; match zed's approach.
opt-level = 2
